plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.jammasjid.digital'
    compileSdk 35

    defaultConfig {
        applicationId 'id.jammasjid.digital'
        minSdk 23
        targetSdk 35
        // Nomor versi naik otomatis di setiap build GitHub Actions
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int
        versionCode 100 + build
        versionName "1.1.${build}"
    }

    // Kunci tanda tangan tetap, dibaca dari GitHub Secrets (jangan disimpan di repo)
    def keystorePath = System.getenv('KEYSTORE_FILE')
    if (keystorePath) {
        signingConfigs {
            debug {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'smartmasjid'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
